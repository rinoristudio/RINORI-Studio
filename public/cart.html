<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Your Cart · Rinori Studio</title>
  <link rel="icon" href="/assets/RINORI%20STUDIO%20logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&family=Sacramento&family=Shrikhand&family=Zen+Maru+Gothic:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <main class="container">
    <div class="page-title">
      <span class="script" style="font-size:2.6rem">your little</span>
      <h1 class="display">Shopping Bag</h1>
    </div>
    <div data-root><p class="empty">Loading…</p></div>
  </main>

  <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
  <script src="/js/common.js"></script>
  <script>
    (async () => {
      const me = await requireUser();
      renderHeader(me, 'cart');
      renderFooter();
      petals(8);

      const root = document.querySelector('[data-root]');
      const { products } = await api('/api/products');
      const byId = Object.fromEntries(products.map(p => [p.id, p]));
      const addresses = me.user.addresses;
      let noteDraft = '';
      let selectedAddress = (addresses.find(a => a.isDefault) || addresses[0] || {}).id;

      // Drop anything that is no longer for sale.
      Cart.write(Cart.read().filter(i => byId[i.productId]));

      function render() {
        const lines = Cart.read().map(i => ({ ...i, p: byId[i.productId] }));
        if (!lines.length) {
          root.innerHTML = `<div class="card empty" style="margin-bottom:70px"><div class="ico">🛍️</div><p>Your bag is empty. Let's find something cute!</p><a class="btn" href="/home#shop">Start shopping</a></div>`;
          return;
        }
        const subtotal = lines.reduce((s, l) => s + l.p.price * l.qty, 0);
        const shipping = lines.reduce((s, l) => s + l.p.shipping, 0);
        const total = subtotal + shipping;
        const pay = me.payment;
        const tooMany = lines.some(l => l.qty > l.p.stock);

        root.innerHTML = `
          <div class="cart-layout">
            <div>
              <div class="card">
                <h2 class="section-title">Items</h2>
                ${lines.map(l => `
                  <div class="cart-item">
                    <a href="/product?id=${l.p.id}"><img src="${esc(l.p.images[0])}" alt=""></a>
                    <div>
                      <a href="/product?id=${l.p.id}" style="color:var(--berry);font-weight:700">${esc(l.p.name)}</a>
                      <div class="muted small">${inr(l.p.price)} each · ${l.p.shipping ? `${inr(l.p.shipping)} shipping` : 'Free shipping'}</div>
                      ${l.qty > l.p.stock ? `<div class="small" style="color:var(--danger)">Only ${l.p.stock} in stock</div>` : ''}
                    </div>
                    <div class="right">
                      <div class="qty">
                        <button type="button" data-dec="${l.p.id}" aria-label="Less">−</button><span>${l.qty}</span><button type="button" data-inc="${l.p.id}" aria-label="More">+</button>
                      </div>
                      <b>${inr(l.p.price * l.qty)}</b>
                      <button class="linkbtn" data-remove="${l.p.id}">Remove</button>
                    </div>
                  </div>`).join('')}
              </div>

              <div class="card" style="margin-top:30px">
                <h2 class="section-title">Deliver to</h2>
                ${addresses.length ? `
                  ${addresses.map(a => `
                    <label class="addr-option">
                      <input type="radio" name="addr" value="${a.id}" ${a.id === selectedAddress ? 'checked' : ''}>
                      <div>
                        <b>${esc(a.fullName)}</b> <span class="pill">${esc(a.type)}</span>${a.isDefault ? '<span class="pill blue">Default</span>' : ''}
                        <div class="small">${formatAddress(a)}</div>
                        <div class="small muted">📞 ${esc(a.phone)}</div>
                      </div>
                    </label>`).join('')}
                  <a class="btn small soft" href="/address?next=cart">+ Add another address</a>` : `
                  <div class="notice">📮 <b>Please add your delivery address</b> to place this order. Don't worry, your bag is saved!</div>
                  <a class="btn" href="/address?next=cart">+ Add delivery address</a>`}
              </div>
            </div>

            <div class="card" style="position:sticky;top:100px">
              <span class="tape" style="top:-12px;left:50%;margin-left:-45px;transform:rotate(-3deg)"></span>
              <h2 class="section-title">Summary</h2>
              <div class="sum-row"><span>Subtotal</span><span>${inr(subtotal)}</span></div>
              <div class="sum-row"><span>Speed Post shipping</span><span>${shipping ? inr(shipping) : 'Free 🎉'}</span></div>
              <div class="sum-row total"><span>Total</span><span>${inr(total)}</span></div>
              <div class="field" style="margin-top:14px">
                <label for="note">Note for us <span class="opt">(optional)</span></label>
                <textarea id="note" maxlength="500" placeholder="Gift message, colour preference…" style="min-height:70px">${esc(noteDraft)}</textarea>
              </div>

              <h2 class="section-title" style="margin-top:6px">Payment</h2>
              ${pay.ready ? `
                <p class="small" style="margin:0 0 14px">🔒 Pay securely with <b>Razorpay</b>: UPI (GPay, PhonePe, Paytm), cards, netbanking or wallets. Your order is placed as soon as the payment goes through.</p>
                <button class="btn block" data-place ${!addresses.length || tooMany ? 'disabled' : ''}>Pay ${inr(total)} &amp; place order</button>
                ${!addresses.length ? '<p class="small muted" style="text-align:center;margin:10px 0 0">Add an address to place your order</p>' : ''}
                ${pay.mode === 'test' ? '<p class="small" style="text-align:center;margin:10px 0 0;color:var(--danger)">Test mode: no real money is taken</p>' : ''}`
              : `<div class="notice">Online payment is being set up. Please DM us on Instagram <a href="${CONTACT.instagramUrl}" target="_blank" rel="noopener">@${CONTACT.instagram}</a> to order.</div>`}
            </div>
          </div>`;
      }

      root.addEventListener('change', e => {
        if (e.target.name === 'addr') selectedAddress = e.target.value;
      });
      root.addEventListener('input', e => {
        if (e.target.id === 'note') noteDraft = e.target.value;
      });

      root.addEventListener('click', async e => {
        const t = e.target.closest('button');
        if (!t) return;
        const line = id => Cart.read().find(i => i.productId === id);
        if (t.dataset.inc) {
          const l = line(t.dataset.inc);
          Cart.set(l.productId, Math.min(20, byId[l.productId].stock, l.qty + 1));
          render();
        } else if (t.dataset.dec) {
          const l = line(t.dataset.dec);
          if (l.qty > 1) Cart.set(l.productId, l.qty - 1);
          render();
        } else if (t.dataset.remove) {
          Cart.remove(t.dataset.remove);
          render();
        } else if (t.hasAttribute('data-place')) {
          pay(t);
        }
      });

      function showThanks(order) {
        Cart.clear();
        root.innerHTML = `
          <div class="card" style="text-align:center;max-width:560px;margin:0 auto 70px">
            <div style="font-size:3rem">🌸</div>
            <span class="script" style="font-size:2.6rem">thank you!</span>
            <h2 class="display sm" style="font-size:2rem">Order Placed</h2>
            <p>Payment of <b>${inr(order.total)}</b> received. Your order number is <b>${esc(order.number)}</b>.</p>
            <p class="muted">We'll pack it with love and send it by India Post Speed Post. The tracking number will appear in your account.</p>
            <div style="display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:20px">
              <a class="btn" href="/account#orders">Track my order</a>
              <a class="btn ghost" href="/home">Keep shopping</a>
            </div>
          </div>`;
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }

      async function pay(btn) {
        if (typeof Razorpay === 'undefined') return toast('Payment window could not load. Please check your internet and refresh.', true);
        setBusy(btn, true, 'Opening payment…');
        let checkout;
        try {
          checkout = await api('/api/checkout', {
            method: 'POST',
            body: { items: Cart.read(), addressId: selectedAddress, note: noteDraft },
          });
        } catch (err) {
          toast(err.message, true);
          return setBusy(btn, false);
        }

        const rzp = new Razorpay({
          ...checkout.razorpay,
          image: location.origin + LOGO,
          theme: { color: '#f2709a' },
          handler: async response => {
            setBusy(btn, true, 'Confirming payment…');
            try {
              const { order } = await api('/api/checkout/verify', { method: 'POST', body: response });
              showThanks(order);
            } catch (err) {
              toast(err.message, true);
              setBusy(btn, false);
            }
          },
          modal: {
            ondismiss: () => {
              setBusy(btn, false);
              toast('Payment cancelled. Your bag is still here.');
            },
          },
        });
        rzp.on('payment.failed', resp => {
          toast(resp.error?.description || 'Payment failed. Please try again.', true);
        });
        rzp.open();
      }

      render();
    })();
  </script>
</body>
</html>
